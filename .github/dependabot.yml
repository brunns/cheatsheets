version: 2

updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    assignees:
      - "brunns"
    cooldown:
      default-days: 7
    groups:
      all_gha:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/tests"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    assignees:
      - "brunns"
    cooldown:
      default-days: 7
    groups:
      all:
        patterns:
          - "*"
